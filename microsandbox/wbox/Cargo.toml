[package]
name = "wbox"
version = "0.1.0"
edition = "2024"
description = "Work box: microsandbox-backed devstation sandboxes"
publish = false

[dependencies]
microsandbox = { version = "0.6.16", features = ["ssh"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
